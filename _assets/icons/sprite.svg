     chosen because a PAINT SERVER is unusable from a display:none subtree, and the AI sparkle used
     to be painted by a <linearGradient> declared here. That gradient is gone (2026-08-28) and the
     sparkle is a plain fill now, so either mechanism would do — left as it is because it works and
     because a future paint server would need it again. -->
