       button. The path was the OUTER SUBPATH of this glyph with the inner counter dropped — and
       that counter is the entire paper-plane reading: without it there is no notch in the left
       edge and no divider, so what is left is a solid arrowhead.
       [hard] AN OUTLINE'S COUNTER DOES NOT "CLOSE UP INTO A SMUDGE" at this size, which was the
       reason given for filling it. Rendered at the real 18px on the real dark circle, the plane
       reads clearly and the triangle reads as play. Legibility is a thing you look at.
