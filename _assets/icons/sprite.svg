  <!--
    Movelli SVG icon sprite — inlined once per page (zero extra requests, works
    offline). Referenced via <use href="#icon-*"/>. Colour comes from
    `.icon { fill: currentColor }`, so an icon takes its container's text colour.

    [hard, owner 2026-10-06] EVERY ICON IS MATERIAL SYMBOLS IN ONE AXIS SET: weight 400,
    grade 0, optical size 24, fill 0. That is Google's default cut, `<name>_24px.svg` — never
    `_fill1_` (`materialsymbolsoutlined` is the FAMILY directory, not the cut). Each path is
    Google's byte for byte, so it can be diffed against upstream, and every icon shares the
    viewBox "0 -960 960 960". Fetch a new one from this URL, on one line so it can be pasted:
    https://raw.githubusercontent.com/google/material-design-icons/master/symbols/web/<name>/materialsymbolsoutlined/<name>_24px.svg
